# Include this file inside nginx's `http {}` block.
# Rate limits use the client address Nginx sees. If Nginx is behind a CDN,
# configure trusted proxy addresses and real client IP handling separately.
limit_req_zone $binary_remote_addr zone=passshield_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=passshield_improve:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=passshield_connections:10m;

# Avoid serving a version banner from the reverse proxy.
server_tokens off;
